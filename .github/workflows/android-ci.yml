name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        run: gradle :core:training:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :wear:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test phone app launch
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.rakdatak.app.preview053.test/androidx.test.runner.AndroidJUnitRunner | tee voice-test.log
            grep -q "OK (1 test)" voice-test.log
            adb logcat -c
            adb shell am start -W -n com.rakdatak.app.preview053/com.rakdatak.app.MainActivity
            sleep 4
            adb shell screencap -p /sdcard/rakdatak-ui.png
            adb pull /sdcard/rakdatak-ui.png rakdatak-ui.png
            adb shell pidof com.rakdatak.app.preview053
            adb logcat -d -t 300 | grep -E "FATAL EXCEPTION|Process: com.rakdatak.app.preview053" && exit 1 || true

      - name: Upload phone UI screenshot for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rakdatak-phone-ui
          path: rakdatak-ui.png
          if-no-files-found: warn

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: rakdatak-phone-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: rakdatak-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

      - name: Publish downloadable phone test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="phone-v0.5.3"
          APK="app/build/outputs/apk/debug/app-debug.apk#rakdatak-phone-0.5.3.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "ركضتك - هاتف 0.5.3" --notes "إصلاح التوجيهات الصوتية: 40 ملف MP3 منفصل، مشغل أكثر توافقًا مع Android، زر معاينة الصوت في الإعدادات، واختيار الصوت يعيد تفعيل التوجيهات. رجل Charon وامرأة Despina. يبقى العداد مستمرًا دون زامور." --prerelease
          fi
