name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        run: gradle :core:training:testDebugUnitTest :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test phone app launch
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.rakdatak.app/.MainActivity
            sleep 4
            PID=$(adb shell pidof com.rakdatak.app | tr -d '\r')
            if [ -z "$PID" ]; then
              echo "Rakdatak process is not running after launch"
              adb logcat -d -t 300
              exit 1
            fi
            if adb logcat -d -t 300 | grep -E "FATAL EXCEPTION|Process: com.rakdatak.app"; then
              echo "Crash detected after launch"
              adb logcat -d -t 300
              exit 1
            fi

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: rakdatak-phone-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: rakdatak-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
