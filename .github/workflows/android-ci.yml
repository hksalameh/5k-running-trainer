name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Build and test
        run: gradle :core:training:testDebugUnitTest :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test phone app launch
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.rakdatak.app/.MainActivity
            sleep 4
            adb shell pidof com.rakdatak.app
            adb logcat -d -t 300 | grep -E "FATAL EXCEPTION|Process: com.rakdatak.app" && exit 1 || true

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: rakdatak-phone-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: rakdatak-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

      - name: Publish correctly versioned phone test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Read the built phone app's version; never publish under a stale tag.
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read a valid Android phone versionName"
            exit 1
          fi
          TAG="phone-v${VERSION}"
          APK="app/build/outputs/apk/debug/app-debug.apk#rakdatak-phone-${VERSION}.apk"

          # Do not silently replace a previously published release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Increase versionName before publishing."
            exit 1
          fi

          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "ركضتك - هاتف ${VERSION}" \
            --notes "نسخة الهاتف التجريبية ${VERSION}؛ بدون رسوم أو إعلانات. تُثبّت خارج المتجر للتجربة." \
            --prerelease
